<svg xmlns="http://www.w3.org/2000/svg" width="420" height="731" viewBox="0 0 420 731" role="img" aria-label="Delivery Unconfirmed"><rect x="0" y="0" width="420" height="731" fill="white"/><g font-family="Arial,sans-serif" fill="#222"><text x="24" y="30" font-size="12" font-weight="700">LOW-FIDELITY DESIGN HYPOTHESIS</text><text x="24" y="50" font-size="20" font-weight="700">WF05 | Delivery Unconfirmed</text><text x="24" y="75" font-size="12" font-weight="400">Synthetic fixtures only. No device is</text><text x="24" y="95" font-size="12" font-weight="400">controlled.</text><rect x="12" y="114" width="396" height="75" fill="#f4f4f4" stroke="#aaa"/><text x="24" y="132" font-size="16" font-weight="700">Delivery unconfirmed</text><text x="24" y="157" font-size="14" font-weight="400">No verified actual food output for this event.</text><rect x="12" y="196" width="396" height="95" fill="#f4f4f4" stroke="#aaa"/><text x="24" y="214" font-size="16" font-weight="700">What we know</text><text x="24" y="239" font-size="14" font-weight="400">A dispense attempt occurred at Demo day 1,</text><text x="24" y="259" font-size="14" font-weight="400">18:00.</text><rect x="12" y="298" width="396" height="95" fill="#f4f4f4" stroke="#aaa"/><text x="24" y="316" font-size="16" font-weight="700">What we do not know</text><text x="24" y="341" font-size="14" font-weight="400">Actual food delivery was not confirmed. Pet</text><text x="24" y="361" font-size="14" font-weight="400">consumption is not known.</text><rect x="12" y="400" width="396" height="135" fill="#f4f4f4" stroke="#aaa"/><text x="24" y="418" font-size="16" font-weight="700">Suggested action</text><text x="24" y="443" font-size="14" font-weight="400">Check the feeder / food if needed, using safe</text><text x="24" y="463" font-size="14" font-weight="400">local procedures. Unknown is neither confirmed</text><text x="24" y="483" font-size="14" font-weight="400">success nor proven failure. No automatic</text><text x="24" y="503" font-size="14" font-weight="400">retry.</text><rect x="24" y="536" width="372" height="40" fill="#ddd" stroke="#555"/><text x="24" y="553" font-size="14" font-weight="700">Local check concept</text><rect x="24" y="590" width="372" height="40" fill="#ddd" stroke="#555"/><text x="24" y="607" font-size="14" font-weight="700">Back to event</text><text x="24" y="671" font-size="12" font-weight="400">Canvas is not a physical display</text><text x="24" y="691" font-size="12" font-weight="400">specification.</text></g></svg>