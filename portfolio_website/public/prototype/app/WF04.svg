<svg xmlns="http://www.w3.org/2000/svg" width="420" height="649" viewBox="0 0 420 649" role="img" aria-label="Feed Event Detail"><rect x="0" y="0" width="420" height="649" fill="white"/><g font-family="Arial,sans-serif" fill="#222"><text x="24" y="30" font-size="12" font-weight="700">LOW-FIDELITY DESIGN HYPOTHESIS</text><text x="24" y="50" font-size="20" font-weight="700">WF04 | Feed Event Detail</text><text x="24" y="75" font-size="12" font-weight="400">Synthetic fixtures only. No device is</text><text x="24" y="95" font-size="12" font-weight="400">controlled.</text><rect x="12" y="114" width="396" height="95" fill="#f4f4f4" stroke="#aaa"/><text x="24" y="132" font-size="16" font-weight="700">Event</text><text x="24" y="157" font-size="14" font-weight="400">Demo day 1, 18:00: A dispense attempt was</text><text x="24" y="177" font-size="14" font-weight="400">recorded.</text><rect x="12" y="216" width="396" height="135" fill="#f4f4f4" stroke="#aaa"/><text x="24" y="234" font-size="16" font-weight="700">Evidence boundary</text><text x="24" y="259" font-size="14" font-weight="400">A command or motor action is not proof that</text><text x="24" y="279" font-size="14" font-weight="400">food was delivered. This bounded recent event</text><text x="24" y="299" font-size="14" font-weight="400">view is not an expanded history/analytics</text><text x="24" y="319" font-size="14" font-weight="400">feature.</text><rect x="12" y="358" width="396" height="95" fill="#f4f4f4" stroke="#aaa"/><text x="24" y="376" font-size="16" font-weight="700">Freshness</text><text x="24" y="401" font-size="14" font-weight="400">Last synced: Demo day 2, 07:30. Event time and</text><text x="24" y="421" font-size="14" font-weight="400">sync time describe different things.</text><rect x="24" y="454" width="372" height="40" fill="#ddd" stroke="#555"/><text x="24" y="471" font-size="14" font-weight="700">Understand unconfirmed output</text><rect x="24" y="508" width="372" height="40" fill="#ddd" stroke="#555"/><text x="24" y="525" font-size="14" font-weight="700">Back to Home</text><text x="24" y="589" font-size="12" font-weight="400">Canvas is not a physical display</text><text x="24" y="609" font-size="12" font-weight="400">specification.</text></g></svg>