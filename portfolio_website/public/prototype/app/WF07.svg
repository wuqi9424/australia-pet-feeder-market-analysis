<svg xmlns="http://www.w3.org/2000/svg" width="420" height="689" viewBox="0 0 420 689" role="img" aria-label="Error / Attention"><rect x="0" y="0" width="420" height="689" fill="white"/><g font-family="Arial,sans-serif" fill="#222"><text x="24" y="30" font-size="12" font-weight="700">LOW-FIDELITY DESIGN HYPOTHESIS</text><text x="24" y="50" font-size="20" font-weight="700">WF07 | Error / Attention</text><text x="24" y="75" font-size="12" font-weight="400">Synthetic fixtures only. No device is</text><text x="24" y="95" font-size="12" font-weight="400">controlled.</text><rect x="12" y="114" width="396" height="135" fill="#f4f4f4" stroke="#aaa"/><text x="24" y="132" font-size="16" font-weight="700">Possible feeding issue</text><text x="24" y="157" font-size="14" font-weight="400">In this separate synthetic fixture the feeder</text><text x="24" y="177" font-size="14" font-weight="400">recorded an execution problem at Demo day 1,</text><text x="24" y="197" font-size="14" font-weight="400">18:00. Cause and actual output are not</text><text x="24" y="217" font-size="14" font-weight="400">established.</text><rect x="12" y="256" width="396" height="95" fill="#f4f4f4" stroke="#aaa"/><text x="24" y="274" font-size="16" font-weight="700">Suggested action</text><text x="24" y="299" font-size="14" font-weight="400">Check the feeder safely. No unsupported “jam</text><text x="24" y="319" font-size="14" font-weight="400">detected” diagnosis or retry action.</text><rect x="12" y="358" width="396" height="135" fill="#f4f4f4" stroke="#aaa"/><text x="24" y="376" font-size="16" font-weight="700">Other evidence variants</text><text x="24" y="401" font-size="14" font-weight="400">Not executed: only if valid time/occurrence</text><text x="24" y="421" font-size="14" font-weight="400">evidence establishes no execution. Delayed</text><text x="24" y="441" font-size="14" font-weight="400">notification: show original event time and</text><text x="24" y="461" font-size="14" font-weight="400">stale/historical label, not current proof.</text><rect x="24" y="494" width="372" height="40" fill="#ddd" stroke="#555"/><text x="24" y="511" font-size="14" font-weight="700">View event details</text><rect x="24" y="548" width="372" height="40" fill="#ddd" stroke="#555"/><text x="24" y="565" font-size="14" font-weight="700">Maintenance guidance</text><text x="24" y="629" font-size="12" font-weight="400">Canvas is not a physical display</text><text x="24" y="649" font-size="12" font-weight="400">specification.</text></g></svg>