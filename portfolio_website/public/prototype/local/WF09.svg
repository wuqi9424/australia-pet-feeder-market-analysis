<svg xmlns="http://www.w3.org/2000/svg" width="420" height="984" viewBox="0 0 420 984" role="img" aria-label="Simplified Local Interface Concept"><rect x="0" y="0" width="420" height="984" fill="white"/><g font-family="Arial,sans-serif" fill="#222"><text x="24" y="30" font-size="12" font-weight="700">LOW-FIDELITY DESIGN HYPOTHESIS</text><text x="24" y="50" font-size="20" font-weight="700">WF09 | Simplified Local</text><text x="24" y="75" font-size="20" font-weight="700">Interface Concept</text><text x="24" y="100" font-size="12" font-weight="400">Synthetic fixtures only. No device is</text><text x="24" y="120" font-size="12" font-weight="400">controlled.</text><rect x="12" y="139" width="396" height="135" fill="#f4f4f4" stroke="#aaa"/><text x="24" y="157" font-size="16" font-weight="700">App is optional</text><text x="24" y="182" font-size="14" font-weight="400">Local schedule, local edit, manual-feed</text><text x="24" y="202" font-size="14" font-weight="400">review, status check and maintenance remain</text><text x="24" y="222" font-size="14" font-weight="400">accessible under declared powered/valid</text><text x="24" y="242" font-size="14" font-weight="400">conditions.</text><rect x="12" y="281" width="396" height="115" fill="#f4f4f4" stroke="#aaa"/><text x="24" y="299" font-size="16" font-weight="700">Local configuration</text><text x="24" y="324" font-size="14" font-weight="400">Set/check time → Draft meal → Review → Save</text><text x="24" y="344" font-size="14" font-weight="400">locally → Inspect active plan. No</text><text x="24" y="364" font-size="14" font-weight="400">registration/pairing prerequisite.</text><rect x="12" y="403" width="396" height="135" fill="#f4f4f4" stroke="#aaa"/><text x="24" y="421" font-size="16" font-weight="700">Manual feed boundary</text><text x="24" y="446" font-size="14" font-weight="400">Review intended portion and upcoming scheduled</text><text x="24" y="466" font-size="14" font-weight="400">meal. Policy unresolved / design decision</text><text x="24" y="486" font-size="14" font-weight="400">required near a scheduled meal. No automatic</text><text x="24" y="506" font-size="14" font-weight="400">skip, double feed or retry.</text><rect x="12" y="545" width="396" height="135" fill="#f4f4f4" stroke="#aaa"/><text x="24" y="563" font-size="16" font-weight="700">Hardware concept</text><text x="24" y="588" font-size="14" font-weight="400">Abstract interaction roles only, not final</text><text x="24" y="608" font-size="14" font-weight="400">industrial design. No screen size, display</text><text x="24" y="628" font-size="14" font-weight="400">technology, specific buttons or sensor</text><text x="24" y="648" font-size="14" font-weight="400">capability selected.</text><rect x="24" y="681" width="372" height="40" fill="#ddd" stroke="#555"/><text x="24" y="698" font-size="14" font-weight="700">Local configuration demo</text><rect x="24" y="735" width="372" height="40" fill="#ddd" stroke="#555"/><text x="24" y="752" font-size="14" font-weight="700">Local event evidence</text><rect x="24" y="789" width="372" height="40" fill="#ddd" stroke="#555"/><text x="24" y="806" font-size="14" font-weight="700">Local maintenance demo</text><rect x="24" y="843" width="372" height="40" fill="#ddd" stroke="#555"/><text x="24" y="860" font-size="14" font-weight="700">Manual policy check</text><text x="24" y="924" font-size="12" font-weight="400">Canvas is not a physical display</text><text x="24" y="944" font-size="12" font-weight="400">specification.</text></g></svg>