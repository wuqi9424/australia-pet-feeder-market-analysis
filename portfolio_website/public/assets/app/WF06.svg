<svg xmlns="http://www.w3.org/2000/svg" width="420" height="845" viewBox="0 0 420 845" role="img" aria-label="Device Offline"><rect x="0" y="0" width="420" height="845" fill="white"/><g font-family="Arial,sans-serif" fill="#222"><text x="24" y="30" font-size="12" font-weight="700">LOW-FIDELITY DESIGN HYPOTHESIS</text><text x="24" y="50" font-size="20" font-weight="700">WF06 | Device Offline</text><text x="24" y="75" font-size="12" font-weight="400">Synthetic fixtures only. No device is</text><text x="24" y="95" font-size="12" font-weight="400">controlled.</text><rect x="12" y="114" width="396" height="115" fill="#f4f4f4" stroke="#aaa"/><text x="24" y="132" font-size="16" font-weight="700">Device offline</text><text x="24" y="157" font-size="14" font-weight="400">Remote information unavailable. Last synced:</text><text x="24" y="177" font-size="14" font-weight="400">Demo day 2, 07:30. This is cached information,</text><text x="24" y="197" font-size="14" font-weight="400">not live status.</text><rect x="12" y="236" width="396" height="95" fill="#f4f4f4" stroke="#aaa"/><text x="24" y="254" font-size="16" font-weight="700">Last known next meal</text><text x="24" y="279" font-size="14" font-weight="400">Demo day 2, 18:00 | Portion A, demo-v1.</text><text x="24" y="299" font-size="14" font-weight="400">Current device configuration may differ.</text><rect x="12" y="338" width="396" height="135" fill="#f4f4f4" stroke="#aaa"/><text x="24" y="356" font-size="16" font-weight="700">Local feeding boundary</text><text x="24" y="381" font-size="14" font-weight="400">Scheduled meals continue locally only if</text><text x="24" y="401" font-size="14" font-weight="400">device power, time and configuration remain</text><text x="24" y="421" font-size="14" font-weight="400">valid. The App cannot verify these conditions</text><text x="24" y="441" font-size="14" font-weight="400">while offline.</text><rect x="12" y="480" width="396" height="115" fill="#f4f4f4" stroke="#aaa"/><text x="24" y="498" font-size="16" font-weight="700">Remote controls unavailable</text><text x="24" y="523" font-size="14" font-weight="400">Viewing cached information is possible; a</text><text x="24" y="543" font-size="14" font-weight="400">fresh remote edit cannot be confirmed. Offline</text><text x="24" y="563" font-size="14" font-weight="400">is not a feeding-failure diagnosis.</text><rect x="24" y="596" width="372" height="40" fill="#eee" stroke="#555"/><text x="24" y="613" font-size="14" font-weight="700">Remote send unavailable</text><rect x="24" y="650" width="372" height="40" fill="#ddd" stroke="#555"/><text x="24" y="667" font-size="14" font-weight="700">Check local concept</text><rect x="24" y="704" width="372" height="40" fill="#ddd" stroke="#555"/><text x="24" y="721" font-size="14" font-weight="700">Back to cached Home</text><text x="24" y="785" font-size="12" font-weight="400">Canvas is not a physical display</text><text x="24" y="805" font-size="12" font-weight="400">specification.</text></g></svg>