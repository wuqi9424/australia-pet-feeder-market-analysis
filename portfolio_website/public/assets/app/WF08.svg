<svg xmlns="http://www.w3.org/2000/svg" width="420" height="689" viewBox="0 0 420 689" role="img" aria-label="Maintenance"><rect x="0" y="0" width="420" height="689" fill="white"/><g font-family="Arial,sans-serif" fill="#222"><text x="24" y="30" font-size="12" font-weight="700">LOW-FIDELITY DESIGN HYPOTHESIS</text><text x="24" y="50" font-size="20" font-weight="700">WF08 | Maintenance</text><text x="24" y="75" font-size="12" font-weight="400">Synthetic fixtures only. No device is</text><text x="24" y="95" font-size="12" font-weight="400">controlled.</text><rect x="12" y="114" width="396" height="115" fill="#f4f4f4" stroke="#aaa"/><text x="24" y="132" font-size="16" font-weight="700">On the local device</text><text x="24" y="157" font-size="14" font-weight="400">Enter maintenance → Feeding paused → Refill /</text><text x="24" y="177" font-size="14" font-weight="400">clean → Reassemble → Readiness check →</text><text x="24" y="197" font-size="14" font-weight="400">Explicit resume.</text><rect x="12" y="236" width="396" height="115" fill="#f4f4f4" stroke="#aaa"/><text x="24" y="254" font-size="16" font-weight="700">Protection</text><text x="24" y="279" font-size="14" font-weight="400">No unexpected dispensing during the declared</text><text x="24" y="299" font-size="14" font-weight="400">safe procedure. This App page is guidance, not</text><text x="24" y="319" font-size="14" font-weight="400">a remote pause/resume controller.</text><rect x="12" y="358" width="396" height="135" fill="#f4f4f4" stroke="#aaa"/><text x="24" y="376" font-size="16" font-weight="700">Meal due during maintenance</text><text x="24" y="401" font-size="14" font-weight="400">Show Not executed only if evidence supports</text><text x="24" y="421" font-size="14" font-weight="400">it; otherwise Unconfirmed. Late-meal/catch-up</text><text x="24" y="441" font-size="14" font-weight="400">policy remains unresolved. Do not</text><text x="24" y="461" font-size="14" font-weight="400">automatically dispense extra food.</text><rect x="24" y="494" width="372" height="40" fill="#ddd" stroke="#555"/><text x="24" y="511" font-size="14" font-weight="700">View local maintenance concept</text><rect x="24" y="548" width="372" height="40" fill="#ddd" stroke="#555"/><text x="24" y="565" font-size="14" font-weight="700">Back to Home</text><text x="24" y="629" font-size="12" font-weight="400">Canvas is not a physical display</text><text x="24" y="649" font-size="12" font-weight="400">specification.</text></g></svg>