<svg xmlns="http://www.w3.org/2000/svg" width="420" height="669" viewBox="0 0 420 669" role="img" aria-label="Create / Edit Meal"><rect x="0" y="0" width="420" height="669" fill="white"/><g font-family="Arial,sans-serif" fill="#222"><text x="24" y="30" font-size="12" font-weight="700">LOW-FIDELITY DESIGN HYPOTHESIS</text><text x="24" y="50" font-size="20" font-weight="700">WF03 | Create / Edit Meal</text><text x="24" y="75" font-size="12" font-weight="400">Synthetic fixtures only. No device is</text><text x="24" y="95" font-size="12" font-weight="400">controlled.</text><rect x="12" y="114" width="396" height="95" fill="#f4f4f4" stroke="#aaa"/><text x="24" y="132" font-size="16" font-weight="700">Draft</text><text x="24" y="157" font-size="14" font-weight="400">Fixture edit: 19:00 | Portion A. Based on</text><text x="24" y="177" font-size="14" font-weight="400">device version demo-v1.</text><rect x="12" y="216" width="396" height="135" fill="#f4f4f4" stroke="#aaa"/><text x="24" y="234" font-size="16" font-weight="700">Review before sending</text><text x="24" y="259" font-size="14" font-weight="400">Changing an App draft does not change the</text><text x="24" y="279" font-size="14" font-weight="400">active local plan. This synthetic example</text><text x="24" y="299" font-size="14" font-weight="400">assumes a valid edit away from an unresolved</text><text x="24" y="319" font-size="14" font-weight="400">near-meal cutoff.</text><rect x="12" y="358" width="396" height="115" fill="#f4f4f4" stroke="#aaa"/><text x="24" y="376" font-size="16" font-weight="700">Commit boundary</text><text x="24" y="401" font-size="14" font-weight="400">Review → Send change → Waiting for device</text><text x="24" y="421" font-size="14" font-weight="400">confirmation → Device confirmed OR Could not</text><text x="24" y="441" font-size="14" font-weight="400">confirm. No food-delivery claim.</text><rect x="24" y="474" width="372" height="40" fill="#ddd" stroke="#555"/><text x="24" y="491" font-size="14" font-weight="700">Review draft</text><rect x="24" y="528" width="372" height="40" fill="#ddd" stroke="#555"/><text x="24" y="545" font-size="14" font-weight="700">Discard draft / Back</text><text x="24" y="609" font-size="12" font-weight="400">Canvas is not a physical display</text><text x="24" y="629" font-size="12" font-weight="400">specification.</text></g></svg>